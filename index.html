<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (function () {
        try {
          var redirect = sessionStorage.redirect;
          if (redirect && redirect !== location.href) {
            delete sessionStorage.redirect;
            history.replaceState(null, '', redirect);
          }
        } catch (e) {
          /* storage 不可用时静默降级 */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人网站：前端开发、算法与生活。" />
    <meta name="theme-color" content="#0a0a12" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta property="og:title" content="个人网站" />
    <meta property="og:description" content="前端开发、算法与生活。" />

    <style>
      html { background: #0a0a12; }
    </style>
  </head>
  <body>
    <div id="app" style="min-height: 100vh"></div>
    <script>
      // 首帧高度占位（v1.5）：仅首页设置——SPA mount 前 #app 高度对齐最终内容高度，
      // 消除 Vue mount「空→满」的文档高度跳变（CLS 伪影）。
      // 其他页面用 100vh 即可，避免短内容页底部留白。
      // 占位取「内容高度 + 少量余量」：内容增长时 min-height 不限制（无跳变）；
      // 改版后若首页高度变化明显，同步更新这两个值。
      (function () {
        var app = document.getElementById('app');
        if (!app) return;
        var seg = location.pathname.split('/');
        var root = seg[1] ? '/' + seg[1] + '/' : '/';
        if (location.pathname === root) {
          app.style.minHeight = window.innerWidth < 768 ? '3600px' : '3120px';
        } else {
          app.style.minHeight = '100vh';
        }
      })();
    </script>
    <div id="boot-hint" aria-hidden="true">
      <div class="boot-spinner"></div>
      <p>正在进入星港…</p>
    </div>
    <style>
      #boot-hint {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0a0a12;
        color: #9ca3af;
        font-size: 14px;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(139, 92, 246, 0.3);
        border-top-color: #22d3ee;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
    <!--
      footer 静态化（v1.5）：首帧即存在于 DOM，避免 Vue mount「空→满」插入的 CLS 伪影。
      站内链接带 data-spa，由 App.vue 的 click 委托接管为无刷新路由跳转。
