<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (function () {
        try {
          var redirect = sessionStorage.redirect;
          if (redirect && redirect !== location.href) {
            delete sessionStorage.redirect;
            history.replaceState(null, '', redirect);
          }
        } catch (e) {
          /* storage 不可用时静默降级 */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人网站：前端开发、算法与生活。" />
    <meta name="theme-color" content="#0a0a12" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta property="og:title" content="个人网站" />
    <meta property="og:description" content="前端开发、算法与生活。" />
    <title>个人网站</title>
    <!--
          ✦            ✦
       ✦       ✦        ✦
          ✦   ✦  ✦  ✦
      ✦  STELLAR MAP v1.4  ✦
        ✦      ✦     ✦
      the stars remember every commit.
    -->
    <style>
      html { background: #0a0a12; }
    </style>
  </head>
  <body>
    <div id="app" style="min-height: 100vh"></div>
    <script>
      // 首帧高度占位：SPA mount 前 #app 的高度对齐最终内容高度，
      // 消除 Vue mount「空→满」的文档高度跳变（CLS，v1.5 定位）。
      // 占位取「当前内容高度 + 少量余量」：内容增长时 min-height 不限制（无跳变），
      // 内容收缩时留白可接受；改版后若首页高度变化明显，同步更新这两个值。
      (function () {
        var app = document.getElementById('app');
        if (!app) return;
        app.style.minHeight = window.innerWidth < 768 ? '3150px' : '2500px';
      })();
    </script>
    <div id="boot-hint" aria-hidden="true">
      <div class="boot-spinner"></div>
      <p>正在进入星港…</p>
    </div>
    <style>
      #boot-hint {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0a0a12;
        color: #9ca3af;
        font-size: 14px;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(139, 92, 246, 0.3);
        border-top-color: #22d3ee;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
