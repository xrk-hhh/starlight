name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-github-stats.mjs
      - name: Fetch OJ stats
        env:
          # 洛谷个人主页 uid（luogu.com.cn/user/{uid}）；未配置则跳过，前端用手填数据
          LUOGU_UID: ${{ vars.LUOGU_UID }}
        run: node scripts/fetch-oj-stats.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
